# Rebuilds every table once a night. Scheduled runs only fire from the default branch.
# Repository secrets needed: ALPACA_API_KEY, ALPACA_SECRET_KEY, FRED_API_KEY,
# SEC_USER_AGENT, GCP_PROJECT_ID, GCP_SERVICE_ACCOUNT_KEY (the JSON key file's content).
name: Nightly data refresh
on:
  schedule:
    - cron: "17 7 * * 2-6"   # 07:17 UTC, Tue-Sat: after the US close and the SEC's nightly update
  workflow_dispatch:
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}
      - run: python -m pipeline
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
